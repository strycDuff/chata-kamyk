<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vybavení &amp; nákup · Chata Kamyk</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  :root {
    --ok: #1b5e3b;
    --warn: #8a4b00;
    --soft: #eef2f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--site-ink);
    background:
      radial-gradient(ellipse at 80% 0%, rgba(31, 78, 107, 0.07), transparent 45%),
      linear-gradient(180deg, #f7f5f1 0%, var(--site-bg) 100%);
    min-height: 100vh;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 72px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.6rem, 3.5vw, 2.1rem);
    color: var(--site-accent);
    letter-spacing: -0.02em;
  }
  .lead {
    margin: 0 0 20px;
    color: var(--site-muted);
    max-width: 42em;
    line-height: 1.45;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 18px;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--site-line);
    background: var(--site-panel);
    color: var(--site-ink);
    padding: 7px 12px;
    border-radius: 4px;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--site-accent); }
  .btn.primary {
    background: var(--site-accent);
    border-color: var(--site-accent);
    color: #fff;
  }
  .btn.linkish {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  a.btn { color: inherit; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--site-panel);
    border: 1px solid var(--site-line);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .stat .v {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--site-accent);
  }
  .stat .l {
    font-size: 0.8rem;
    color: var(--site-muted);
    margin-top: 2px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tabs button {
    appearance: none;
    border: 1px solid var(--site-line);
    background: transparent;
    color: var(--site-muted);
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--site-accent);
    border-color: var(--site-accent);
    color: #fff;
    font-weight: 600;
  }
  .callout {
    border-left: 3px solid var(--warn);
    background: #fff8ef;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    color: var(--site-ink);
    line-height: 1.4;
  }
  .callout a { color: var(--site-accent); }
  .areas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }
  .area {
    background: var(--site-panel);
    border: 1px solid var(--site-line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 0.88rem;
  }
  .area strong { display: block; margin-bottom: 2px; }
  .area span { color: var(--site-muted); }
  .room-block { margin-bottom: 28px; }
  .room-block h2 {
    margin: 0 0 10px;
    font-size: 1.15rem;
    color: var(--site-accent);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .room-total { font-weight: 600; color: var(--site-ink); font-size: 0.95rem; }
  .item {
    background: var(--site-panel);
    border: 1px solid var(--site-line);
    border-radius: 4px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .item.excluded { opacity: 0.55; }
  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--site-line);
    background: var(--soft);
  }
  .item-head label.include {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
  }
  .item-meta {
    font-size: 0.8rem;
    color: var(--site-muted);
    white-space: nowrap;
  }
  .options { padding: 4px 0; }
  .opt {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 10px 12px;
    border-top: 1px solid transparent;
  }
  .opt + .opt { border-top-color: var(--site-line); }
  .opt.selected { background: #f0f6fa; }
  .opt input { margin-top: 3px; }
  .opt-name { font-weight: 600; margin: 0 0 2px; }
  .opt-note { font-size: 0.82rem; color: var(--site-muted); margin: 0 0 4px; line-height: 1.35; }
  .opt a {
    color: var(--site-accent);
    font-size: 0.85rem;
    word-break: break-all;
  }
  .opt-price {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .opt-price .unit { display: block; font-size: 0.75rem; color: var(--site-muted); }
  .opt-price .line { font-weight: 700; color: var(--site-accent); }
  .grand {
    position: sticky;
    bottom: 0;
    background: rgba(255,255,255,0.94);
    border-top: 1px solid var(--site-line);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    backdrop-filter: blur(6px);
  }
  .grand strong { font-size: 1.15rem; color: var(--site-accent); }
  .muted { color: var(--site-muted); font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <nav class="site-nav" aria-label="Hlavní navigace">
    <a class="brand" href="../">Chata Kamyk</a>
    <a href="../">Přehled</a>
    <a href="../koupelna/">Plánovač</a>
    <a class="active" href="./">Vybavení</a>
    <a href="../smarthome/">SmartHome</a>
  </nav>

  <main>
    <h1>Vybavení &amp; nákup</h1>
    <p class="lead">
      Read-only katalog z nákupního seznamu. Zaškrtni položky, vyber variantu, součty se přepočítají.
      Stav se ukládá do prohlížeče; export/import JSON jako u plánovače.
    </p>

    <div class="toolbar">
      <button type="button" class="btn primary" id="btn-export">Export JSON</button>
      <button type="button" class="btn" id="btn-import">Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" class="btn" id="btn-reset">Obnovit výchozí výběr</button>
      <a class="btn linkish" id="sheet-link" href="#" target="_blank" rel="noopener">Google Sheet</a>
    </div>

    <div class="stats" id="stats"></div>
    <div class="callout" id="source-note"></div>
    <div class="tabs" id="tabs"></div>
    <div class="areas" id="areas"></div>
    <div id="rooms"></div>
  </main>

  <div class="grand">
    <div>
      <div class="muted">Součet vybraných položek</div>
      <strong id="grand-total">0 Kč</strong>
    </div>
    <div class="muted" id="grand-meta"></div>
  </div>

<script>
(() => {
  const STORAGE_KEY = "chata-kamyk-vybaveni-picks-v1";
  let catalog = null;
  let state = { picks: {}, excluded: {}, qty: {} };
  let activeRoom = "all";

  const el = (id) => document.getElementById(id);
  const cz = (n) => Math.round(n).toLocaleString("cs-CZ");

  function defaultPick(item) {
    const d = item.options.find((o) => o.default) || item.options[0];
    return d?.id || null;
  }

  function seedState() {
    const picks = {};
    const excluded = {};
    const qty = {};
    for (const room of catalog.rooms) {
      for (const item of room.items) {
        picks[item.id] = defaultPick(item);
        if (item.unit !== "m2" && item.qty != null) qty[item.id] = item.qty;
      }
    }
    return { picks, excluded, qty };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedState();
      const parsed = JSON.parse(raw);
      const base = seedState();
      return {
        picks: { ...base.picks, ...(parsed.picks || {}) },
        excluded: { ...(parsed.excluded || {}) },
        qty: { ...base.qty, ...(parsed.qty || {}) },
      };
    } catch {
      return seedState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function itemQty(item) {
    if (item.unit === "m2") {
      const a = catalog.areas[item.areaKey];
      return a ? a.buy : 0;
    }
    const q = Number(state.qty[item.id]);
    return Number.isFinite(q) && q > 0 ? q : (item.qty || 1);
  }

  function selectedOption(item) {
    const id = state.picks[item.id];
    return item.options.find((o) => o.id === id) || item.options[0];
  }

  function itemTotal(item) {
    if (state.excluded[item.id]) return 0;
    const opt = selectedOption(item);
    if (!opt) return 0;
    return itemQty(item) * Number(opt.price || 0);
  }

  function roomTotal(room) {
    return room.items.reduce((s, it) => s + itemTotal(it), 0);
  }

  function grandTotal() {
    return catalog.rooms.reduce((s, r) => s + roomTotal(r), 0);
  }

  function selectedCount() {
    let n = 0;
    for (const room of catalog.rooms) {
      for (const item of room.items) {
        if (!state.excluded[item.id]) n += 1;
      }
    }
    return n;
  }

  function renderStats() {
    const total = grandTotal();
    el("stats").innerHTML = `
      <div class="stat"><div class="v">${cz(total)} Kč</div><div class="l">Celkem vybrané</div></div>
      <div class="stat"><div class="v">${selectedCount()}</div><div class="l">Aktivních položek</div></div>
      <div class="stat"><div class="v">30,2 m²</div><div class="l">Světlost chaty</div></div>
      <div class="stat"><div class="v">${catalog.rooms.length}</div><div class="l">Místností</div></div>
    `;
    el("grand-total").textContent = `${cz(total)} Kč`;
    el("grand-meta").textContent = `${selectedCount()} položek · uloženo v localStorage`;
  }

  function renderAreas() {
    el("areas").innerHTML = Object.values(catalog.areas).map((a) => `
      <div class="area">
        <strong>${a.label}</strong>
        <span>netto ${a.net} m² → koupit ${a.buy} m² (+10 %)</span>
      </div>
    `).join("");
  }

  function renderTabs() {
    const tabs = [{ id: "all", name: "Vše" }, ...catalog.rooms.map((r) => ({ id: r.id, name: r.name }))];
    el("tabs").innerHTML = tabs.map((t) =>
      `<button type="button" data-room="${t.id}" class="${t.id === activeRoom ? "active" : ""}">${t.name}</button>`
    ).join("");
  }

  function renderRooms() {
    const rooms = activeRoom === "all"
      ? catalog.rooms
      : catalog.rooms.filter((r) => r.id === activeRoom);
    el("rooms").innerHTML = rooms.map((room) => {
      const items = room.items.map((item) => {
        const excluded = !!state.excluded[item.id];
        const qty = itemQty(item);
        const unitLabel = item.unit === "m2" ? "m²" : item.unit;
        const opts = item.options.map((opt) => {
          const selected = selectedOption(item)?.id === opt.id;
          const line = qty * opt.price;
          return `
            <div class="opt ${selected && !excluded ? "selected" : ""}">
              <input type="radio" name="${item.id}" value="${opt.id}"
                ${selected ? "checked" : ""} ${excluded ? "disabled" : ""}
                data-item="${item.id}" aria-label="${opt.name}">
              <div>
                <p class="opt-name">${opt.name}</p>
                ${opt.note ? `<p class="opt-note">${opt.note}</p>` : ""}
                <a href="${opt.url}" target="_blank" rel="noopener">Otevřít v e-shopu</a>
              </div>
              <div class="opt-price">
                <span>${cz(opt.price)} Kč</span>
                <span class="unit">× ${qty} ${unitLabel}</span>
                <span class="line">${selected && !excluded ? cz(line) + " Kč" : "—"}</span>
              </div>
            </div>
          `;
        }).join("");
        return `
          <article class="item ${excluded ? "excluded" : ""}" data-item="${item.id}">
            <div class="item-head">
              <label class="include">
                <input type="checkbox" data-include="${item.id}" ${excluded ? "" : "checked"}>
                ${item.label}
              </label>
              <div class="item-meta">${cz(itemTotal(item))} Kč</div>
            </div>
            <div class="options">${opts}</div>
          </article>
        `;
      }).join("");
      return `
        <section class="room-block" data-room="${room.id}">
          <h2>
            <span>${room.name}</span>
            <span class="room-total">${cz(roomTotal(room))} Kč</span>
          </h2>
          ${items}
        </section>
      `;
    }).join("");
  }

  function render() {
    renderTabs();
    renderAreas();
    renderRooms();
    renderStats();
  }

  function exportJson() {
    const payload = {
      app: "chata-kamyk-vybaveni",
      version: 1,
      exportedAt: new Date().toISOString(),
      catalogSource: catalog.source,
      state,
      totals: {
        grand: grandTotal(),
        byRoom: Object.fromEntries(catalog.rooms.map((r) => [r.id, roomTotal(r)])),
      },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `chata-kamyk-vybaveni-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function importJson(file) {
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = data.state || data;
    if (!incoming || typeof incoming !== "object") throw new Error("Neplatný soubor");
    const base = seedState();
    state = {
      picks: { ...base.picks, ...(incoming.picks || {}) },
      excluded: { ...(incoming.excluded || {}) },
      qty: { ...base.qty, ...(incoming.qty || {}) },
    };
    saveState();
    render();
  }

  el("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-room]");
    if (!btn) return;
    activeRoom = btn.dataset.room;
    render();
  });

  el("rooms").addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("input[data-include]")) {
      const id = t.dataset.include;
      if (t.checked) delete state.excluded[id];
      else state.excluded[id] = true;
      saveState();
      render();
      return;
    }
    if (t.matches('input[type="radio"][data-item]')) {
      state.picks[t.dataset.item] = t.value;
      saveState();
      render();
    }
  });

  el("btn-export").addEventListener("click", exportJson);
  el("btn-import").addEventListener("click", () => el("import-file").click());
  el("import-file").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      await importJson(file);
    } catch (err) {
      alert("Import selhal: " + (err.message || err));
    }
  });
  el("btn-reset").addEventListener("click", () => {
    if (!confirm("Obnovit výchozí výběr variant a zrušit vyloučené položky?")) return;
    state = seedState();
    saveState();
    render();
  });

  fetch("./catalog.json")
    .then((r) => {
      if (!r.ok) throw new Error("catalog.json");
      return r.json();
    })
    .then((data) => {
      catalog = data;
      state = loadState();
      const sheet = el("sheet-link");
      sheet.href = catalog.sheetUrl;
      el("source-note").innerHTML =
        `Zdroj: ${catalog.source}. Původní tabulka (záloha): <a href="${catalog.sheetUrl}" target="_blank" rel="noopener">Google Sheet</a>. ` +
        `Plochy z finálního půdorysu (světlost 9,06×3,33 m). Katalog je read-only — při změně seznamu dej vědět.`;
      render();
    })
    .catch((err) => {
      el("source-note").textContent = "Nepodařilo se načíst katalog: " + err;
    });
})();
</script>
</body>
</html>
